<div class="min-h-screen md:grid md:grid-cols-[260px_1fr]">
  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-40 w-64 -translate-x-full bg-sidebar text-sidebar-ink transition-transform duration-200 md:static md:translate-x-0"
    [class.translate-x-0]="sidebarOpen()"
  >
    <div class="flex items-center gap-3 px-5 py-6">
      <svg class="h-9 w-9 flex-none" viewBox="0 0 64 64" fill="none">
        <path
          d="M32 4 57 12v17c0 17-10.5 26-25 30C17.5 55 7 46 7 29V12Z"
          fill="#fff"
          opacity=".95"
        />
        <path
          d="M32 8 53 15v14c0 15-9 22.5-21 26C10 51.5 11 44.5 11 29.5V15Z"
          class="fill-accent-strong"
        />
        <path d="M32 15 22 30l7 0 0 12 6 0 0-12 7 0Z" fill="#fff" />
      </svg>
      <div>
        <h1 class="font-serif text-[15px] font-semibold leading-tight text-white">
          Sistema de Información Vehicular
        </h1>
        <small class="text-[11.5px] text-sidebar-ink-dim">Comando Departamental · Oruro</small>
      </div>
    </div>

    <nav class="flex flex-col gap-1 px-3">
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-white/10 text-white"
          class="flex items-center gap-3 rounded-md px-3 py-2 text-[13.5px] font-medium text-sidebar-ink-dim hover:bg-white/5 hover:text-white"
        >
          <span
            class="flex h-[22px] w-[22px] flex-none items-center justify-center rounded-md bg-white/10 text-[10px] font-bold"
          >
            {{ item.icon }}
          </span>
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="mt-auto px-5 py-5 text-[11px] leading-relaxed text-sidebar-ink-dim">
      Sistema de información vehicular
    </div>
  </aside>

  @if (sidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-black/40 md:hidden"
      aria-label="Cerrar menú"
      (click)="toggleSidebar()"
    ></button>
  }

  <!-- Main -->
  <div class="flex min-w-0 flex-col">
    <header
      class="sticky top-0 z-20 flex items-center gap-4 border-b border-edge bg-surface px-5 py-3 md:px-7"
    >
      <button
        type="button"
        class="rounded-md border border-edge-strong px-2.5 py-2 text-[11px] font-semibold md:hidden"
        (click)="toggleSidebar()"
      >
        MENÚ
      </button>

      <span class="font-serif text-[15px] font-semibold hidden sm:inline">Transportes</span>

      <div class="ml-auto flex items-center gap-3">
        <div class="flex items-center gap-1 rounded-full border border-edge bg-surface-2 p-0.5">
          <button
            type="button"
            class="flex h-[26px] w-[26px] items-center justify-center rounded-full text-[13px]"
            [class.bg-accent-strong]="themeService.theme() === 'light'"
            [class.text-white]="themeService.theme() === 'light'"
            (click)="themeService.theme.set('light')"
          >
            ☀
          </button>
          <button
            type="button"
            class="flex h-[26px] w-[26px] items-center justify-center rounded-full text-[13px]"
            [class.bg-accent-strong]="themeService.theme() === 'dark'"
            [class.text-white]="themeService.theme() === 'dark'"
            (click)="themeService.theme.set('dark')"
          >
            ☾
          </button>
        </div>

        <select
          class="rounded-md border border-edge bg-surface-2 px-2.5 py-2 text-[12.5px] font-medium text-ink"
          (change)="onRoleChange($event)"
        >
          @for (role of roles; track role) {
            <option [value]="role" [selected]="role === currentRole.role()">
              {{ roleLabels[role] }}
            </option>
          }
        </select>
      </div>
    </header>

    <main class="mx-auto w-full max-w-[1360px] flex-1 px-5 py-6 md:px-7">
      <router-outlet />
    </main>
  </div>
</div>
