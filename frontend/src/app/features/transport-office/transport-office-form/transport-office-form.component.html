<app-modal
  [title]="isEdit ? 'Editar personal administrativo' : 'Nuevo personal administrativo'"
  (closed)="cancelled.emit()"
>
  <div class="grid grid-cols-1 gap-4 px-6 py-5 min-[860px]:grid-cols-2">
    <app-field label="CI *">
      <input
        appFieldControl
        [value]="form().ci"
        (input)="patch({ ci: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Complemento">
      <input
        appFieldControl
        placeholder="1A"
        [value]="form().ciComplement"
        (input)="patch({ ciComplement: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Nombres *">
      <input
        appFieldControl
        [value]="form().firstName"
        (input)="patch({ firstName: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Apellidos *">
      <input
        appFieldControl
        [value]="form().lastName"
        (input)="patch({ lastName: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Grado">
      <select
        appFieldControl
        [value]="form().rank"
        (change)="patch({ rank: $any($event.target).value })"
      >
        <option value="">Seleccionar...</option>
        @for (rank of rankOptions; track rank) {
          <option [value]="rank">{{ rank }}</option>
        }
      </select>
    </app-field>

    <app-field label="Teléfono">
      <input
        appFieldControl
        [value]="form().phone"
        (input)="patch({ phone: $any($event.target).value })"
      />
    </app-field>

    @if (canManageAccount) {
      <h4 class="font-serif text-14-5 font-semibold min-[860px]:col-span-2">Cuenta de acceso</h4>

      <app-field label="Usuario">
        <input
          appFieldControl
          [value]="form().username"
          (input)="patch({ username: $any($event.target).value })"
        />
      </app-field>

      <app-field label="Contraseña">
        <input
          appFieldControl
          type="password"
          placeholder="Mínimo 8 caracteres"
          [value]="form().password"
          (input)="patch({ password: $any($event.target).value })"
        />
      </app-field>

      <app-field label="Rol de sistema" full>
        <select appFieldControl (change)="patch({ roleId: $any($event.target).value })">
          <option value="" [selected]="!form().roleId">Seleccionar...</option>
          @for (role of roleOptions(); track role.id) {
            <option [value]="role.id" [selected]="role.id === form().roleId">
              {{ role.name }}
            </option>
          }
        </select>
      </app-field>
    }
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      {{ isEdit ? 'Guardar cambios' : 'Guardar' }}
    </button>
  </app-form-actions>
</app-modal>
