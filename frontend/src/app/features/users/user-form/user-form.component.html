<app-modal [title]="isEdit ? 'Editar usuario' : 'Nuevo usuario'" (closed)="cancelled.emit()">
  <div class="grid grid-cols-1 gap-4 px-6 py-5 min-[860px]:grid-cols-2">
    <app-field label="Nombre de usuario *">
      <input
        appFieldControl
        [value]="form().username"
        (input)="patch({ username: $any($event.target).value })"
      />
    </app-field>

    <app-field [label]="'Contraseña ' + (isEdit ? '' : '*')">
      <input
        appFieldControl
        type="password"
        [placeholder]="isEdit ? 'Dejar en blanco para no cambiarla' : 'Mínimo 8 caracteres'"
        [value]="form().password"
        (input)="patch({ password: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Nombre completo *">
      <input
        appFieldControl
        [value]="form().fullName"
        (input)="patch({ fullName: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Rol *">
      <select appFieldControl (change)="patch({ roleId: $any($event.target).value })">
        <option value="" [selected]="!form().roleId">Seleccionar rol...</option>
        @for (role of roles(); track role.id) {
          <option [value]="role.id" [selected]="role.id === form().roleId">
            {{ role.name }}
          </option>
        }
      </select>
    </app-field>

    <app-field label="Grado">
      <input
        appFieldControl
        placeholder="Sgto."
        [value]="form().rank ?? ''"
        (input)="patch({ rank: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Teléfono">
      <input
        appFieldControl
        [value]="form().phone ?? ''"
        (input)="patch({ phone: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Correo">
      <input
        appFieldControl
        type="email"
        [value]="form().email ?? ''"
        (input)="patch({ email: $any($event.target).value })"
      />
    </app-field>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      {{ isEdit ? 'Guardar cambios' : 'Guardar usuario' }}
    </button>
  </app-form-actions>
</app-modal>
