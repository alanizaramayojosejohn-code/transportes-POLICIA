<app-modal title="Nuevo recorrido" (closed)="cancelled.emit()">
  <div class="grid grid-cols-1 gap-4 px-6 py-5 min-[860px]:grid-cols-2">
    @if (isConductor) {
      <app-field label="Vehículo">
        <input appFieldControl [value]="myAssignment()?.vehicle.plate ?? ''" disabled />
      </app-field>
      <app-field label="Conductor">
        <input appFieldControl value="Usted" disabled />
      </app-field>
    } @else {
      <app-field label="Vehículo *" [errorText]="validation.error('vehicleId')">
        <select
          appFieldControl
          [invalid]="!!validation.error('vehicleId')"
          [value]="vehicleId()"
          (change)="vehicleId.set($any($event.target).value)"
          (blur)="validation.touch('vehicleId')"
        >
          <option value="">Seleccionar...</option>
          @for (vehicle of vehicles(); track vehicle.id) {
            <option [value]="vehicle.id">{{ vehicle.plate }}</option>
          }
        </select>
      </app-field>

      <app-field label="Conductor *" [errorText]="validation.error('driverId')">
        <select
          appFieldControl
          [invalid]="!!validation.error('driverId')"
          [value]="driverId()"
          (change)="driverId.set($any($event.target).value)"
          (blur)="validation.touch('driverId')"
        >
          <option value="">Seleccionar...</option>
          @for (driver of drivers(); track driver.id) {
            <option [value]="driver.id">{{ driver.firstName }} {{ driver.lastName }}</option>
          }
        </select>
      </app-field>
    }

    <app-field label="Destino *" full [errorText]="validation.error('destination')">
      <input
        appFieldControl
        [invalid]="!!validation.error('destination')"
        [value]="destination()"
        (input)="destination.set($any($event.target).value)"
        (blur)="validation.touch('destination')"
      />
    </app-field>

    <app-field label="Fecha/hora de salida *" [errorText]="validation.error('departureAt')">
      <input
        appFieldControl
        type="datetime-local"
        [invalid]="!!validation.error('departureAt')"
        [value]="departureAt()"
        (input)="departureAt.set($any($event.target).value)"
        (blur)="validation.touch('departureAt')"
      />
    </app-field>

    <app-field label="Kilometraje de salida *" [errorText]="validation.error('departureOdometer')">
      <input
        appFieldControl
        type="number"
        [invalid]="!!validation.error('departureOdometer')"
        [value]="departureOdometer()"
        (input)="onOdometerInput($any($event.target).value)"
        (blur)="validation.touch('departureOdometer')"
      />
    </app-field>

    <app-field
      label="Nivel de combustible (%)"
      [errorText]="validation.error('departureFuelLevel')"
    >
      <input
        appFieldControl
        type="number"
        min="0"
        max="100"
        [invalid]="!!validation.error('departureFuelLevel')"
        [value]="departureFuelLevel()"
        (input)="onFuelLevelInput($any($event.target).value)"
        (blur)="validation.touch('departureFuelLevel')"
      />
    </app-field>

    <app-field label="Estado del vehículo en salida">
      <input
        appFieldControl
        placeholder="Bueno"
        [value]="departureConditionNotes()"
        (input)="departureConditionNotes.set($any($event.target).value)"
      />
    </app-field>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      Guardar recorrido
    </button>
  </app-form-actions>
</app-modal>
