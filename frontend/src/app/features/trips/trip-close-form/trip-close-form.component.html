<app-modal [title]="'Registrar llegada · ' + trip().vehicle.plate" (closed)="cancelled.emit()">
  @if (!online()) {
    <p
      class="mx-6 mt-5 rounded-sm border border-edge border-l-[3px] border-l-amber bg-surface-2 px-[14px] py-[11px] text-12-5 leading-relaxed text-ink-muted"
    >
      Sin conexión: la llegada se guardará en este equipo con la hora que indique y se enviará sola
      en cuanto haya red.
    </p>
  }

  <div class="grid grid-cols-1 gap-4 px-6 py-5 min-[860px]:grid-cols-2">
    <div class="rounded-sm bg-surface-2 px-3 py-2 text-12-5 text-ink-muted min-[860px]:col-span-2">
      Salida: {{ trip().destination }} · {{ formatDateTime(trip().departureAt) }} · KM
      {{ trip().departureOdometer }}
    </div>

    <app-field label="Fecha/hora de llegada *" [errorText]="validation.error('returnAt')">
      <input
        appFieldControl
        type="datetime-local"
        [invalid]="!!validation.error('returnAt')"
        [value]="returnAt()"
        (input)="returnAt.set($any($event.target).value)"
        (blur)="validation.touch('returnAt')"
      />
    </app-field>

    <app-field label="Kilometraje de llegada *" [errorText]="validation.error('returnOdometer')">
      <input
        appFieldControl
        type="number"
        [invalid]="!!validation.error('returnOdometer')"
        [value]="returnOdometer()"
        (input)="onOdometerInput($any($event.target).value)"
        (blur)="validation.touch('returnOdometer')"
      />
    </app-field>

    <app-field label="Nivel de combustible (%)" [errorText]="validation.error('returnFuelLevel')">
      <input
        appFieldControl
        type="number"
        min="0"
        max="100"
        [invalid]="!!validation.error('returnFuelLevel')"
        [value]="returnFuelLevel()"
        (input)="onFuelLevelInput($any($event.target).value)"
        (blur)="validation.touch('returnFuelLevel')"
      />
    </app-field>

    <app-trip-condition-field
      label="Estado del vehículo en llegada"
      [(code)]="conditionCode"
      [(otherText)]="conditionOther"
      [otherErrorText]="validation.error('conditionOther')"
    />

    <app-field label="Daños observados">
      <input
        appFieldControl
        [value]="damagesFound()"
        (input)="damagesFound.set($any($event.target).value)"
      />
    </app-field>

    <app-field label="Observaciones" full>
      <textarea
        appFieldControl
        rows="2"
        [value]="incidentNotes()"
        (input)="incidentNotes.set($any($event.target).value)"
      ></textarea>
    </app-field>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      Registrar llegada
    </button>
  </app-form-actions>
</app-modal>
