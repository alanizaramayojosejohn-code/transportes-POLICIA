<app-modal
  [title]="'Finalizar mantenimiento · ' + order().vehicle.plate"
  (closed)="cancelled.emit()"
>
  <div class="grid grid-cols-1 gap-4 px-6 py-5">
    <div class="rounded-sm bg-surface-2 px-3 py-2 text-12-5 text-ink-muted">
      {{ order().description }}
    </div>

    <app-field label="Costo total (Bs.) *">
      <input
        appFieldControl
        type="number"
        step="0.01"
        [value]="totalCost()"
        (input)="onCostInput($any($event.target).value)"
      />
    </app-field>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      Finalizar
    </button>
  </app-form-actions>
</app-modal>
