<app-modal title="Nueva asignación de unidad" (closed)="cancelled.emit()">
  <div
    class="mx-6 mt-4 rounded-md border-l-2 border-accent bg-surface-2 p-3 text-[12.5px] text-ink-muted"
  >
    Registra la asignación ya determinada por el proceso institucional; no administra solicitudes.
  </div>

  <div class="grid grid-cols-1 gap-4 px-6 py-5 sm:grid-cols-2">
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Vehículo *</span>
      <select
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="vehicleId()"
        (change)="vehicleId.set($any($event.target).value)"
      >
        <option value="">Seleccionar...</option>
        @for (v of vehicles(); track v.id) {
          <option [value]="v.id">{{ v.plate }}</option>
        }
      </select>
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Unidad *</span>
      <select
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="unitId()"
        (change)="unitId.set($any($event.target).value)"
      >
        <option value="">Seleccionar...</option>
        @for (u of units(); track u.id) {
          <option [value]="u.id">{{ u.name }}</option>
        }
      </select>
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Fecha inicio *</span>
      <input
        type="date"
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="startDate()"
        (input)="startDate.set($any($event.target).value)"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Documento / referencia</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        placeholder="ACT-000/2026"
        [value]="referenceDocument()"
        (input)="referenceDocument.set($any($event.target).value)"
      />
    </label>

    <label class="flex flex-col gap-1.5 sm:col-span-2">
      <span class="text-xs font-semibold text-ink-muted">Motivo</span>
      <textarea
        class="min-h-14 rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="reason()"
        (input)="reason.set($any($event.target).value)"
      ></textarea>
    </label>

    <label class="flex flex-col gap-1.5 sm:col-span-2">
      <span class="text-xs font-semibold text-ink-muted">Observaciones</span>
      <textarea
        class="min-h-14 rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="notes()"
        (input)="notes.set($any($event.target).value)"
      ></textarea>
    </label>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-[13px] text-red">{{ errorMessage() }}</p>
  }

  <div class="sticky bottom-0 flex justify-end gap-2.5 border-t border-edge bg-surface px-6 py-4">
    <button
      type="button"
      class="rounded-md border border-edge-strong px-4 py-2 text-[13px] font-semibold text-ink"
      (click)="cancelled.emit()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="rounded-md bg-accent-strong px-4 py-2 text-[13px] font-semibold text-on-accent disabled:opacity-60"
      [disabled]="submitting()"
      (click)="submit()"
    >
      Guardar asignación
    </button>
  </div>
</app-modal>
