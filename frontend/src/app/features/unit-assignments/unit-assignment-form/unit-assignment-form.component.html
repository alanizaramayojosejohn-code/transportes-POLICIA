<app-modal title="Nueva asignación de unidad" (closed)="cancelled.emit()">
  <app-notice class="mx-6 mt-4">
    Registra la asignación ya determinada por el proceso institucional; no administra solicitudes.
  </app-notice>

  <div class="grid grid-cols-1 gap-4 px-6 py-5 min-[860px]:grid-cols-2">
    <app-field label="Vehículo *" [errorText]="validation.error('vehicleId')">
      <select
        appFieldControl
        [invalid]="!!validation.error('vehicleId')"
        [value]="vehicleId()"
        (change)="vehicleId.set($any($event.target).value)"
        (blur)="validation.touch('vehicleId')"
      >
        <option value="">Seleccionar...</option>
        @for (v of vehicles(); track v.id) {
          <option [value]="v.id">{{ v.plate }}</option>
        }
      </select>
    </app-field>

    <app-field label="Unidad *" [errorText]="validation.error('unitId')">
      <select
        appFieldControl
        [invalid]="!!validation.error('unitId')"
        [value]="unitId()"
        (change)="unitId.set($any($event.target).value)"
        (blur)="validation.touch('unitId')"
      >
        <option value="">Seleccionar...</option>
        @for (u of units(); track u.id) {
          <option [value]="u.id">{{ u.name }}</option>
        }
      </select>
    </app-field>

    <app-field label="Fecha inicio *" [errorText]="validation.error('startDate')">
      <input
        appFieldControl
        type="date"
        [invalid]="!!validation.error('startDate')"
        [value]="startDate()"
        (input)="startDate.set($any($event.target).value)"
        (blur)="validation.touch('startDate')"
      />
    </app-field>

    <app-field label="Documento / referencia">
      <input
        appFieldControl
        placeholder="ACT-000/2026"
        [value]="referenceDocument()"
        (input)="referenceDocument.set($any($event.target).value)"
      />
    </app-field>

    <app-field label="Motivo" full>
      <textarea
        appFieldControl
        [value]="reason()"
        (input)="reason.set($any($event.target).value)"
      ></textarea>
    </app-field>

    <app-field label="Observaciones" full>
      <textarea
        appFieldControl
        [value]="notes()"
        (input)="notes.set($any($event.target).value)"
      ></textarea>
    </app-field>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      Guardar asignación
    </button>
  </app-form-actions>
</app-modal>
