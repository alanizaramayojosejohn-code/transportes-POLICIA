<app-modal
  [title]="isEdit ? 'Editar vehículo' : 'Registro de vehículo'"
  (closed)="cancelled.emit()"
>
  <div class="grid grid-cols-1 gap-4 px-6 py-5 sm:grid-cols-2">
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Placa *</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().plate"
        (input)="patch({ plate: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Placa DNFR</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().plateDnfr ?? ''"
        (input)="patch({ plateDnfr: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Tipo de vehículo *</span>
      <select
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        (change)="patch({ type: $any($event.target).value })"
      >
        @for (type of types; track type) {
          <option [value]="type" [selected]="type === form().type">{{ typeLabels[type] }}</option>
        }
      </select>
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Marca</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().brand ?? ''"
        (input)="patch({ brand: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Modelo</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().model ?? ''"
        (input)="patch({ model: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Año</span>
      <input
        type="number"
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().year ?? ''"
        (input)="
          patch({ year: $any($event.target).value ? +$any($event.target).value : undefined })
        "
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Número de chasis</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().chassisNumber ?? ''"
        (input)="patch({ chassisNumber: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Número de motor</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().engineNumber ?? ''"
        (input)="patch({ engineNumber: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Color</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().color ?? ''"
        (input)="patch({ color: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">País de origen</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().origin ?? ''"
        (input)="patch({ origin: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Fuente de recepción</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().receptionSource ?? ''"
        (input)="patch({ receptionSource: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5 sm:col-span-2">
      <span class="text-xs font-semibold text-ink-muted">Observaciones</span>
      <textarea
        class="min-h-16 rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().observations ?? ''"
        (input)="patch({ observations: $any($event.target).value })"
      ></textarea>
    </label>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-[13px] text-red">{{ errorMessage() }}</p>
  }

  <div class="sticky bottom-0 flex justify-end gap-2.5 border-t border-edge bg-surface px-6 py-4">
    <button
      type="button"
      class="rounded-md border border-edge-strong px-4 py-2 text-[13px] font-semibold text-ink"
      (click)="cancelled.emit()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="rounded-md bg-accent-strong px-4 py-2 text-[13px] font-semibold text-on-accent disabled:opacity-60"
      [disabled]="submitting()"
      (click)="submit()"
    >
      {{ isEdit ? 'Guardar cambios' : 'Guardar vehículo' }}
    </button>
  </div>
</app-modal>
