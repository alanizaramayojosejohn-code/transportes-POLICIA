<app-page-head
  title="Reportes"
  description="Consultas consolidadas para seguimiento, control interno y toma de decisiones."
></app-page-head>

<div class="grid grid-cols-1 gap-4 min-[640px]:grid-cols-2 min-[960px]:grid-cols-3">
  @for (card of cards(); track card.key) {
    <app-card>
      <h3 class="mb-1.5 text-14-5 font-semibold">{{ card.title }}</h3>
      <p class="mb-4 text-13 text-ink-muted">{{ card.description }}</p>
      <div class="flex flex-wrap gap-2">
        <button type="button" appButton variant="primary" size="sm" (click)="open(card)">
          Generar reporte
        </button>
        <button type="button" appButton size="sm" (click)="detailCard.set(card)">Ver ficha</button>
      </div>
    </app-card>
  } @empty {
    <app-notice>No hay reportes disponibles para su rol.</app-notice>
  }
</div>

@if (detailCard(); as card) {
  <app-report-detail [card]="card" (opened)="open($event)" (closed)="detailCard.set(null)" />
}
