@if (card(); as c) {
  <app-modal
    eyebrow="REPORTE"
    [title]="c.title"
    [description]="c.description"
    (closed)="closed.emit()"
  >
    <div class="px-[22px] py-5">
      <div class="grid grid-cols-1 gap-3.5 min-[480px]:grid-cols-2">
        <app-data-cell label="Pantalla">{{ c.path }}</app-data-cell>
        <app-data-cell label="Roles con acceso">{{ rolesLabel() }}</app-data-cell>
        <app-data-cell label="Filtros">{{ c.filters }}</app-data-cell>
        <app-data-cell label="Formatos de salida">Excel · PDF</app-data-cell>
      </div>

      <div class="mt-4 grid grid-cols-1 gap-3">
        <app-detail-section label="Qué incluye">{{ c.includes }}</app-detail-section>
        <app-detail-section label="Cómo se genera"
          >Se arma con los datos vigentes del sistema al momento de abrirlo. Los botones Excel y PDF
          de la pantalla exportan todo el resultado filtrado, no sólo la página en
          pantalla.</app-detail-section
        >
      </div>
    </div>

    <app-form-actions>
      <button type="button" appButton (click)="closed.emit()">Cerrar</button>
      <button type="button" appButton variant="primary" (click)="opened.emit(c)">
        Abrir reporte
      </button>
    </app-form-actions>
  </app-modal>
}
