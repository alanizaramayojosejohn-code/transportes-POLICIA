<app-modal title="Designar encargado de transportes" (closed)="cancelled.emit()">
  <div class="grid grid-cols-1 gap-4 px-6 py-5 min-[860px]:grid-cols-2">
    <app-field label="Personal *" full>
      <select
        appFieldControl
        [value]="officerId()"
        (change)="officerId.set($any($event.target).value)"
      >
        <option value="">Seleccionar...</option>
        @for (officer of officers(); track officer.id) {
          <option [value]="officer.id">
            {{ officer.rank ? officer.rank + ' ' : '' }}{{ officer.firstName }}
            {{ officer.lastName }}
          </option>
        }
      </select>
    </app-field>

    <app-field label="Fecha desde *">
      <input
        appFieldControl
        type="date"
        [value]="startDate()"
        (input)="startDate.set($any($event.target).value)"
      />
    </app-field>

    <app-field label="Documento / referencia">
      <input
        appFieldControl
        [value]="referenceDocument()"
        (input)="referenceDocument.set($any($event.target).value)"
      />
    </app-field>

    <app-field label="Observaciones" full>
      <textarea
        appFieldControl
        [value]="notes()"
        (input)="notes.set($any($event.target).value)"
      ></textarea>
    </app-field>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      Guardar designación
    </button>
  </app-form-actions>
</app-modal>
