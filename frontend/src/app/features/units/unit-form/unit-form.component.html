<app-modal [title]="isEdit ? 'Editar unidad' : 'Registro de unidad'" (closed)="cancelled.emit()">
  <div class="grid grid-cols-1 gap-4 px-6 py-5 min-[860px]:grid-cols-2">
    <app-field label="Código" [errorText]="validation.error('code')">
      <input
        appFieldControl
        placeholder="EPI-03"
        [invalid]="!!validation.error('code')"
        [value]="form().code ?? ''"
        (input)="patch({ code: $any($event.target).value })"
        (blur)="validation.touch('code')"
      />
    </app-field>

    <app-field label="Nombre *" [errorText]="validation.error('name')">
      <input
        appFieldControl
        placeholder="EPI 3"
        [invalid]="!!validation.error('name')"
        [value]="form().name"
        (input)="patch({ name: $any($event.target).value })"
        (blur)="validation.touch('name')"
      />
    </app-field>

    <app-field label="Tipo">
      <input
        appFieldControl
        placeholder="Unidad operativa"
        [value]="form().type ?? ''"
        (input)="patch({ type: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Ubicación">
      <input
        appFieldControl
        placeholder="Oruro"
        [value]="form().location ?? ''"
        (input)="patch({ location: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Unidad superior" full>
      <select
        appFieldControl
        (change)="patch({ parentId: $any($event.target).value || undefined })"
      >
        <option value="" [selected]="!form().parentId">Sin superior</option>
        @for (option of parentOptions; track option.id) {
          <option [value]="option.id" [selected]="option.id === form().parentId">
            {{ option.name }}
          </option>
        }
      </select>
    </app-field>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      {{ isEdit ? 'Guardar cambios' : 'Guardar unidad' }}
    </button>
  </app-form-actions>
</app-modal>
