<app-modal
  [title]="isEdit ? 'Editar personal' : 'Registro de personal'"
  (closed)="cancelled.emit()"
>
  <div class="grid grid-cols-1 gap-4 px-6 py-5 min-[860px]:grid-cols-2">
    <app-field label="CI *">
      <input
        appFieldControl
        [value]="form().ci"
        (input)="patch({ ci: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Complemento">
      <input
        appFieldControl
        placeholder="1A"
        [value]="form().ciComplement ?? ''"
        (input)="patch({ ciComplement: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Nombres *">
      <input
        appFieldControl
        [value]="form().firstName"
        (input)="patch({ firstName: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Apellidos *">
      <input
        appFieldControl
        [value]="form().lastName"
        (input)="patch({ lastName: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Grado">
      <input
        appFieldControl
        placeholder="Sgto."
        [value]="form().rank ?? ''"
        (input)="patch({ rank: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Teléfono">
      <input
        appFieldControl
        [value]="form().phone ?? ''"
        (input)="patch({ phone: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Correo">
      <input
        appFieldControl
        type="email"
        [value]="form().email ?? ''"
        (input)="patch({ email: $any($event.target).value })"
      />
    </app-field>

    <app-field label="Unidad actual">
      <select
        appFieldControl
        (change)="patch({ currentUnitId: $any($event.target).value || undefined })"
      >
        <option value="" [selected]="!form().currentUnitId">Sin unidad</option>
        @for (unit of units(); track unit.id) {
          <option [value]="unit.id" [selected]="unit.id === form().currentUnitId">
            {{ unit.name }}
          </option>
        }
      </select>
    </app-field>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-13 text-red">{{ errorMessage() }}</p>
  }

  <app-form-actions>
    <button type="button" appButton (click)="cancelled.emit()">Cancelar</button>
    <button type="button" appButton variant="primary" [disabled]="submitting()" (click)="submit()">
      {{ isEdit ? 'Guardar cambios' : 'Guardar personal' }}
    </button>
  </app-form-actions>
</app-modal>
