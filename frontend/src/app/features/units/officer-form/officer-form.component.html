<app-modal
  [title]="isEdit ? 'Editar personal' : 'Registro de personal'"
  (closed)="cancelled.emit()"
>
  <div class="grid grid-cols-1 gap-4 px-6 py-5 sm:grid-cols-2">
    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">CI *</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().ci"
        (input)="patch({ ci: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Complemento</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        placeholder="1A"
        [value]="form().ciComplement ?? ''"
        (input)="patch({ ciComplement: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Nombres *</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().firstName"
        (input)="patch({ firstName: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Apellidos *</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().lastName"
        (input)="patch({ lastName: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Grado</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        placeholder="Sgto."
        [value]="form().rank ?? ''"
        (input)="patch({ rank: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Teléfono</span>
      <input
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().phone ?? ''"
        (input)="patch({ phone: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Correo</span>
      <input
        type="email"
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        [value]="form().email ?? ''"
        (input)="patch({ email: $any($event.target).value })"
      />
    </label>

    <label class="flex flex-col gap-1.5">
      <span class="text-xs font-semibold text-ink-muted">Unidad actual</span>
      <select
        class="rounded-md border border-edge bg-surface-2 px-3 py-2 text-[13.5px] text-ink"
        (change)="patch({ currentUnitId: $any($event.target).value || undefined })"
      >
        <option value="" [selected]="!form().currentUnitId">Sin unidad</option>
        @for (unit of units(); track unit.id) {
          <option [value]="unit.id" [selected]="unit.id === form().currentUnitId">
            {{ unit.name }}
          </option>
        }
      </select>
    </label>
  </div>

  @if (errorMessage()) {
    <p class="px-6 text-[13px] text-red">{{ errorMessage() }}</p>
  }

  <div class="sticky bottom-0 flex justify-end gap-2.5 border-t border-edge bg-surface px-6 py-4">
    <button
      type="button"
      class="rounded-md border border-edge-strong px-4 py-2 text-[13px] font-semibold text-ink"
      (click)="cancelled.emit()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="rounded-md bg-accent-strong px-4 py-2 text-[13px] font-semibold text-on-accent disabled:opacity-60"
      [disabled]="submitting()"
      (click)="submit()"
    >
      {{ isEdit ? 'Guardar cambios' : 'Guardar personal' }}
    </button>
  </div>
</app-modal>
