<div class="relative overflow-x-auto">
  @if (loading()) {
    <div
      class="pointer-events-none absolute inset-x-0 top-0 h-0.5 overflow-hidden bg-edge"
      role="status"
      aria-label="Cargando"
    >
      <span class="block h-full w-1/3 animate-indeterminate bg-accent motion-reduce:w-full"></span>
    </div>
  }
  <table class="w-full text-13">
    <ng-content />
  </table>
</div>
@if (footer(); as f) {
  <p class="mt-3 text-12 text-ink-faint">{{ f }}</p>
}
