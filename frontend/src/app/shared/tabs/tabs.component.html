<div class="flex gap-1 overflow-x-auto border-b border-edge px-[22px] pb-4">
  @for (tab of tabs(); track tab.value) {
    <button
      type="button"
      class="whitespace-nowrap rounded-t-sm px-3 py-2 text-13 font-semibold transition-colors"
      [class]="
        tab.value === active()
          ? 'bg-green-bg text-green-700 dark:text-green-300'
          : 'text-ink-muted hover:text-ink'
      "
      (click)="activeChange.emit(tab.value)"
    >
      {{ tab.label }}
    </button>
  }
</div>
