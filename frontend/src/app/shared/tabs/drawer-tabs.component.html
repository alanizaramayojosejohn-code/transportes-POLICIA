<div class="flex gap-0.5 overflow-x-auto border-b border-edge px-[14px] py-2.5">
  @for (tab of tabs(); track tab.value) {
    <button
      type="button"
      class="whitespace-nowrap rounded-full px-[11px] py-[7px] text-12-5 font-semibold transition-colors"
      [class]="
        tab.value === active()
          ? 'bg-green-700 text-white dark:bg-green-400 dark:text-green-900'
          : 'text-ink-muted hover:bg-surface-2 hover:text-ink'
      "
      (click)="activeChange.emit(tab.value)"
    >
      {{ tab.label }}
    </button>
  }
</div>
