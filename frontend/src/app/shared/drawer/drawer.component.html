<div class="fixed inset-0 z-[105] flex justify-end" (keydown)="onKeydown($event)">
  <button
    type="button"
    class="fixed inset-0 z-0 bg-overlay"
    aria-label="Cerrar"
    (click)="closed.emit()"
  ></button>

  <aside
    #panel
    class="animate-drawer-in relative z-10 h-full w-full max-w-[min(480px,92vw)] overflow-y-auto bg-surface shadow-2"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title()"
    tabindex="-1"
  >
    <div class="relative overflow-hidden bg-green-800 p-[22px] text-white">
      <div class="watermark text-white"></div>
      <button
        type="button"
        class="absolute right-[18px] top-[18px] z-[2] flex h-7 w-7 items-center justify-center rounded-full bg-white/10 text-xs font-bold hover:bg-white/20"
        aria-label="Cerrar"
        (click)="closed.emit()"
      >
        ✕
      </button>
      <small class="relative z-[1] text-[11px] font-semibold tracking-wide text-white/70">{{
        eyebrow()
      }}</small>
      <h2 class="relative z-[1] mt-1 font-serif text-20 font-semibold">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="relative z-[1] mt-1 text-12-5 text-white/70">{{ subtitle() }}</p>
      }
    </div>

    <div class="px-[22px] py-5">
      <ng-content />
    </div>
  </aside>
</div>
