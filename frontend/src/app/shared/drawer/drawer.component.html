<div class="fixed inset-0 z-[95] flex justify-end">
  <button
    type="button"
    class="fixed inset-0 z-0 bg-black/45"
    aria-label="Cerrar"
    (click)="closed.emit()"
  ></button>

  <aside class="relative z-10 h-full w-full max-w-[480px] overflow-y-auto bg-surface shadow-2xl">
    <div class="relative bg-accent-strong px-6 py-6 text-white">
      <button
        type="button"
        class="absolute right-4 top-4 flex h-7 w-7 items-center justify-center rounded-full bg-white/10 text-xs font-bold hover:bg-white/20"
        (click)="closed.emit()"
      >
        ✕
      </button>
      <small class="text-[11px] font-semibold tracking-wide text-white/70">{{ eyebrow() }}</small>
      <h2 class="mt-1 font-serif text-xl font-semibold">{{ title() }}</h2>
    </div>

    <div class="px-6 py-5">
      <ng-content />
    </div>
  </aside>
</div>
